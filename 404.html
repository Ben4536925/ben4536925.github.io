<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="../style.css">
    <script>
        window.onload = function () {
            const currentUrl = window.location.href;
            var reqestUrlElement = document.getElementById("request-url");
            reqestUrlElement.href = currentUrl;
            reqestUrlElement.textContent = currentUrl;
        }
    </script>
    <style>
        .circle {
            width: 12px;
            height: 12px;
            background-color: #db3434;
            border-radius: 50%; 
            margin: 5px;
        }
    </style>
</head>

<body>
    <main>
        <h1>404 - ページが見つかりません</h1>
        <p>お探しのページは存在しないか、移動した可能性があります。</p>
        <table>
            <tr>
                <th>リクエストURL</th>
                <td><a id="request-url" href=""></a></td>
            </tr>
            <tr>
                <th>リクエストメゾット</th>
                <td>GET</td>
            </tr>
            <tr>
                <th>ステータスコード</th>
                <td style="display: flex; align-items: center;">
                    <div class="circle"></div>
                    404 Not Found
                </td>
            </tr>
        </table>
        <p><a href="../">ホームに戻る</a></p>
    </main>
